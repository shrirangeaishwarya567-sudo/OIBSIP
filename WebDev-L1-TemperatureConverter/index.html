<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="converter">
    <p class="tag">TEMPERATURE TOOL</p>
    <h1>Temperature Converter</h1>
    <p class="subtitle">
      Convert Celsius, Fahrenheit and Kelvin instantly.
    </p>

    <label for="temperature">Enter temperature</label>
    <input
      type="number"
      id="temperature"
      placeholder="Example: 25"
      step="any"
    >

    <label for="unit">Select input unit</label>
    <select id="unit">
      <option value="celsius">Celsius (°C)</option>
      <option value="fahrenheit">Fahrenheit (°F)</option>
      <option value="kelvin">Kelvin (K)</option>
    </select>

    <button id="convertButton">Convert Temperature</button>

    <p id="error"></p>

    <section class="results">
      <h2>Converted Results</h2>

      <div class="result-card">
        <span>Celsius</span>
        <strong id="celsiusResult">-- °C</strong>
      </div>

      <div class="result-card">
        <span>Fahrenheit</span>
        <strong id="fahrenheitResult">-- °F</strong>
      </div>

      <div class="result-card">
        <span>Kelvin</span>
        <strong id="kelvinResult">-- K</strong>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
